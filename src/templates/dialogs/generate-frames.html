<script type="text/template" id="templates/dialogs/generate-frames.html">
  <div class="dialog-wrapper generate-frames">
    <h3 class="dialog-head">
      Generate Frames
      <span class="dialog-close">×</span>
    </h3>
    <div class="dialog-content">
      <div class="selection-instruction">
        Select two frames to generate intermediate frames between them
      </div>
      <div class="frame-selector">
        <!-- Frames will be populated here -->
      </div>
      <div class="slider-container">
        <input type="range" min="1" max="10" value="3" class="frame-count-slider">
        <span class="slider-value">3</span>
      </div>
      <div class="dialog-actions">
        <button class="button generate-button" disabled>Generate</button>
        <button class="button cancel-button">Cancel</button>
      </div>
      <div class="loading-indicator">
        Generating frames...
      </div>
      <div class="generate-button-wrapper">
        <button class="button generate-rife-button">Generate with RIFE</button>
      </div>
      <div class="progress-bar-wrapper">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>
</script>
